name: Public-only Windows fresh wizard acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  RELEASE_COMMIT: 770eb12da1ba591d4e6f6c4cef57f68a51759cbf
  PRODUCT_COMMIT: a621d5f2649f3931943634b86101ba8134e672fc
  BOOTSTRAP_COMMIT: 86da1dd27fea804ab131a8494b79a2ccf868e847
  SETUP_SHA256: deec71b3a2a2b6d313e8dcd7be54acc2f0a10c6aba54463dafa9117520a778ec
  MANIFEST_SHA256: 831af931f2c94cb42e776b3baa3d00ad91d338f5fdf3695550124f744d05fba2
jobs:
  wizard-fresh:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Exact bootstrap test, from its public immutable commit
        uses: actions/checkout@v4
        with:
          repository: MichaelZelbel/kit-bootstrap
          ref: ${{ env.BOOTSTRAP_COMMIT }}
          path: bootstrap
          persist-credentials: false
      - name: Verify a fresh runner and download only the new public installer
        shell: pwsh
        run: ./scripts/migration/prepare-public-windows-fresh.ps1
      - name: Unchanged fresh wizard test, Next on every page and final page read
        shell: pwsh
        run: |
          ./bootstrap/windows/test-finish-page.ps1 -Setup candidate/GodspeedSetup.exe -Evidence evidence
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Fresh-wizard evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-windows-wizard-fresh
          path: evidence/
          retention-days: 14
