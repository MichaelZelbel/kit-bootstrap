name: Release suites on Linux and a Mac
# kit-bootstrap's own test.sh and the product's collector suite (tools/test-prompt-archive.sh) where
# they really run, bash on a fresh Ubuntu and on a real Mac, for the release after
# godspeed-v2-integrated-2026-10-12-1: the clean-install test's "suites" job, here because the
# private test repository's jobs are refused by GitHub's billing. Both suites are public already.
# macOS has five known failures of test.sh, from bash 3.2 (three `$(case ...)`) and /var against
# /private/var (two), since 8 October; they are listed, not hidden.
on:
  push:
    branches: ['test/release-*']
    paths: ['.github/workflows/release-suites.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: kit-bootstrap test.sh, at the release's kit-bootstrap 0eafb06 (this branch's parent, without its test files)
        shell: bash
        run: |
          set +e
          git clone -q https://github.com/MichaelZelbel/kit-bootstrap.git kb && git -C kb checkout -q 0eafb061d28a077b2d7c0cc83d0bd002fcb44444
          git -C kb log --oneline -1
          (cd kb && bash test.sh) > suite.out 2>&1; rc=$?
          grep -E 'FAIL' -A3 suite.out | head -80; tail -3 suite.out; exit $rc
      - name: the collector's suite, from the product's release branch
        if: always()
        shell: bash
        run: |
          set +e
          git clone -q --depth 1 --branch codex/notebook-production-label-release https://github.com/MichaelZelbel/godspeed-mission-control kit
          git -C kit log --oneline -1
          bash kit/tools/test-prompt-archive.sh > archive.out 2>&1; rc=$?
          grep -v '^  ok' archive.out | tail -15; exit $rc
