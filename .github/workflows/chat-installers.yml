name: Telegram installer components
on:
  push:
    branches: [codex/telegram-clarity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Bash installation components
        if: runner.os != 'Windows'
        run: bash test.sh
      - name: Windows PowerShell 5.1 installation components
        if: runner.os == 'Windows'
        shell: powershell
        run: .\windows\test-windows.ps1
# Actual download and installed-gateway journeys have separate release gates.
